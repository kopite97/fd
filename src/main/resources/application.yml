spring:
  application:
    name: fd

  datasource:
    url: jdbc:postgresql://localhost:5432/fd
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

    show-sql: true

  jackson:
    time-zone: Asia/Seoul

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace