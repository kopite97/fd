spring:
  application:
    name: fd

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/fd
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

    show-sql: true

  jackson:
    time-zone: Asia/Seoul

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

google:
  sheets:
    clubs-url: ${CLUBS_URL}
    emotional-dna-url: ${EMOTIONALDNA_URL}
    playstyle-dna-url: ${PLAYSTYLEDNA_URL}
    club-status-url: ${CLUBSTATUS_URL}
    club-tags-url: ${CLUBTAGS_URL}
    dna-rubric-url: ${DNARUBRIC_URL}
